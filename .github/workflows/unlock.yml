name: unlock engine
# Owner-only unlock for a tripwire-halted paper engine (owner design 2026-07-17).
# RACE-FREE v2: this workflow writes an unlock REQUEST; the engine itself consumes it
# on its next scan (removes the halt, re-anchors the drawdown era, records the reason
# forever). v1 edited the state file directly and a running scanner overwrote it
# within minutes — the engine applying its own unlock cannot lose that race.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Which engine to unlock"
        required: true
        type: choice
        options: [gamma, scalper, defense]
      reason:
        description: "Why are you unlocking it? (recorded forever in the ledger)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: unlock-request

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write unlock request
        env:
          ENGINE: ${{ github.event.inputs.engine }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("docs/unlock_request.json")
          try:
              req = json.loads(p.read_text())
          except Exception:
              req = {}
          req[os.environ["ENGINE"]] = {
              "ts": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "reason": os.environ["REASON"]}
          p.write_text(json.dumps(req, separators=(",", ":")))
          print("request written:", req[os.environ["ENGINE"]])
          PY
      - name: commit
        run: |
          git config user.name "unlock-bot"
          git config user.email "actions@github.com"
          git add docs/unlock_request.json
          git commit -m "unlock request: ${{ github.event.inputs.engine }} — ${{ github.event.inputs.reason }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep 3
          done
          exit 1
