name: backfill bars
# One-off dataset extension (owner go 2026-08-03): fetch 1-minute bars from
# late-March onward via Fyers (cloud creds) and hand them back as an artifact.
# The local machine merges them into fibleg/data/Stocks_data and re-bakes the
# backtest tables. Nothing here touches the live ledgers or the scan loop.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-bars

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
      FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
      FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install --quiet fyers-apiv3 pyotp requests
      - name: fetch bars
        run: python backfill_bars.py
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-bars
          path: backfill_out/
          retention-days: 5
          if-no-files-found: error
