name: fib-leg scan

# GitHub's */15 cron proved unreliable (fired 1-4x/day instead of ~32x). Instead each
# trigger starts a SESSION LOOP: scan -> commit -> sleep 10m, until just past NSE close
# (15:35 IST = 10:05 UTC). Two staggered starters cover a missed/late cron; concurrency
# lets the later starter take over from the earlier one (each leg stays < 6h job limit).
on:
  schedule:
    - cron: "35 3 * * 1-5"    # ~09:05-09:20 IST — covers the open half
    - cron: "0 7 * * 1-5"     # ~12:30 IST — takes over for the close half
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write              # commit docs/signals.json + docs/paper_log.json
  pages: write                 # nudge the Pages deploy after each publish

concurrency:
  group: fibleg-scan-loop
  cancel-in-progress: true     # the newer starter replaces the older loop

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # < 6h hard cap; each cron leg loops ~3.5h
    env:
      SCAN_SOURCE: yf
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in per-run credential (free) — used only to nudge the Pages deploy
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet yfinance dhanhq

      - name: Session loop (scan every 15m until NSE close)
        run: |
          git config user.name  "fib-leg-bot"
          git config user.email "bot@users.noreply.github.com"
          END=$(date -u -d "$(date -u +%F) 10:05" +%s)   # 15:35 IST
          run_once () {
            python scan.py --source "$SCAN_SOURCE" || return 0
            git pull --rebase origin main || true
            git add docs/signals.json docs/paper_log.json docs/paper_levels.json docs/paper_defense.json
            if git diff --staged --quiet; then
              echo "no change"
            else
              git commit -m "scan: update signals feed [skip ci]"
              git push origin main || { git pull --rebase origin main && git push origin main; } || true
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true
            fi
          }
          run_once
          while [ "$(date -u +%s)" -lt "$END" ]; do
            sleep 600
            run_once
          done
          echo "session closed — loop done"
