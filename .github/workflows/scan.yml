name: fib-leg scan

# GitHub's cron is unreliable — it fires late and sometimes SKIPS a scheduled time
# entirely (e.g. 2026-07-06 the 03:35 trigger never fired, leaving the feed stale all
# morning). Defence in depth: each trigger starts a SESSION LOOP (scan -> commit ->
# sleep 10m, until 15:35 IST = 10:05 UTC), and we schedule SEVERAL starters through the
# session so any single skipped cron is covered by the next. concurrency + cancel-in-
# progress means overlapping starters just hand off — the newest loop wins, one at a
# time, each leg well under the 6h job cap.
on:
  schedule:
    - cron: "25 3 * * 1-5"    # ~08:55 IST — be running BEFORE the 09:15 open
    - cron: "35 3 * * 1-5"    # ~09:05 IST
    - cron: "45 3 * * 1-5"    # ~09:15 IST — market open (belt-and-suspenders)
    - cron: "0 4 * * 1-5"     # ~09:30 IST
    - cron: "20 4 * * 1-5"    # ~09:50 IST
    - cron: "0 6 * * 1-5"     # ~11:30 IST
    - cron: "0 7 * * 1-5"     # ~12:30 IST
    - cron: "0 9 * * 1-5"     # ~14:30 IST — covers the close hour
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write              # commit docs/signals.json + docs/paper_log.json
  pages: write                 # nudge the Pages deploy after each publish

concurrency:
  group: fibleg-scan-loop
  cancel-in-progress: true     # the newer starter replaces the older loop

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # < 6h hard cap; each cron leg loops ~3.5h
    env:
      SCAN_SOURCE: fyers      # real-time NSE via Fyers (headless daily login by TOTP);
                              # falls back to yf only if creds/secrets are missing
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in per-run credential (free) — used only to nudge the Pages deploy
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      # Fyers — activation day: add these six secrets + flip SCAN_SOURCE to fyers;
      # the feed then auto-renews the daily token headlessly via TOTP
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
      FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
      FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet yfinance dhanhq fyers-apiv3 pyotp requests

      - name: Session loop (scan every 15m until NSE close)
        run: |
          git config user.name  "fib-leg-bot"
          git config user.email "bot@users.noreply.github.com"
          # refresh the liquid F&O universe once per day (skip if already today's)
          UNIV_DAY=$(python -c "import json;print(json.load(open('docs/book_universe.json'))['generated'])" 2>/dev/null || echo none)
          if [ "$UNIV_DAY" != "$(date -u +%F)" ]; then
            echo "refreshing liquid universe…"
            python build_universe.py 100 100 || echo "universe refresh skipped"
            git add docs/book_universe.json 2>/dev/null || true
          fi
          END=$(date -u -d "$(date -u +%F) 10:05" +%s)   # 15:35 IST
          run_once () {
            python scan.py --source "$SCAN_SOURCE" --days 60 || return 0
            git pull --rebase origin main || true
            git add docs/signals.json docs/paper_log.json docs/paper_levels.json docs/paper_defense.json docs/book_charts.json docs/book_charts_htf.json docs/book_universe.json docs/resting_orders.json
            if git diff --staged --quiet; then
              echo "no change"
            else
              git commit -m "scan: update signals feed [skip ci]"
              git push origin main || { git pull --rebase origin main && git push origin main; } || true
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true
            fi
          }
          run_once
          while [ "$(date -u +%s)" -lt "$END" ]; do
            sleep 300          # 5-min cycle (public repo = free minutes) so the
            run_once           # feed's "updated X ago" stays well under 10 min
          done
          echo "session closed — loop done"
